name: Android Build

# Workflow novo, escrito de raiz — não copiado do pg-sp (não foi lido,
# conforme pedido). Por agora só compila um APK de debug, para validar
# que o projeto builda a cada push/PR. Assinatura de release (keystore,
# alias, senhas via GitHub Secrets) fica por adicionar até termos esses
# dados reais — não inventados aqui.
#
# Todas as actions estão fixadas por SHA de commit (o comentário ao lado
# indica a tag correspondente). Para actualizar: escolher a nova tag,
# resolver o SHA do commit (`git ls-remote --tags <repo>`; em tags
# anotadas usar a linha com `^{}`) e substituir SHA + comentário.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # Garante platform 34 + build-tools instalados e licenças aceites —
      # não depender só do que a imagem do runner já trouxer pré-instalado.
      # FIX (2026-10-01): o v3 pedia por defeito o pacote legado `tools`
      # ("Failed to find package 'tools'"), que a Google já não serve.
      # v4 deixou de o pedir; `packages` explícito instala só o necessário.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # NOTA 1: este projecto ainda não tem o gradle-wrapper.jar comitado
      # (binário — não gerável neste ambiente sem acesso à rede do
      # Gradle). Até ser gerado localmente com `gradle wrapper` e
      # comitado, o runner instala o próprio Gradle em vez de usar
      # ./gradlew. Assim que o wrapper existir no repo, trocar este passo
      # por `./gradlew assembleDebug` (mais rápido e reprodutível).
      # NOTA 2: sem assinatura de release por agora — não vamos para a
      # Play Store nesta fase, só APKs de debug para sideload.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pixgo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
