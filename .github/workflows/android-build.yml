name: Android Build

# Workflow novo, escrito de raiz — não copiado do pg-sp (não foi lido,
# conforme pedido). Por agora só compila um APK de debug, para validar
# que o projeto builda a cada push/PR. Assinatura de release (keystore,
# alias, senhas via GitHub Secrets) fica por adicionar até termos esses
# dados reais — não inventados aqui.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME). O passo
      # android-actions/setup-android@v3 falhava aqui com "Failed to find package
      # 'tools'": por defeito ele corre `sdkmanager tools platform-tools`, e o pacote
      # `tools` já não existe nos cmdline-tools atuais (16.x). Em vez dele, aceitamos
      # as licenças e garantimos platform 34 + build-tools diretamente com o
      # sdkmanager do próprio runner (sem o pacote obsoleto).
      - name: Accept Android SDK licenses and install platform 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      # NOTA 1: este projecto ainda não tem o gradle-wrapper.jar comitado
      # (binário — não gerável neste ambiente sem acesso à rede do
      # Gradle). Até ser gerado localmente com `gradle wrapper` e
      # comitado, o runner instala o próprio Gradle em vez de usar
      # ./gradlew. Assim que o wrapper existir no repo, trocar este passo
      # por `./gradlew assembleDebug` (mais rápido e reprodutível).
      # NOTA 2: sem assinatura de release por agora — não vamos para a
      # Play Store nesta fase, só APKs de debug para sideload.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        env:
          # Client ID Web do Google (o mesmo GOOGLE_CLIENT_ID do backend). Sem ele o
          # botão "Continuar com Google" fica oculto. Pode ser secret ou variable.
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pixgo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
